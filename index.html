<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Glossary · MISMO</title>
<meta name="description" content="Standard definitions for the terms used across the mortgage industry.">
<style>
/* Layout: three directions for the public glossary, one shown at a time; the Summit HQ
   family (navy masthead, white logo plate, sky rule, Plex Sans) opened up for readers. */
:root{
  --navy:#0f314c; --navy-deep:#06202f; --navy-mid:#14486e; --sky:#50a4db; --sky-soft:#94c8e9;
  --paper:#F1F6FA; --surface:#FFFFFF; --sunk:#E9F1F8;
  --ink:#0f314c; --ink-2:#456179; --ink-3:#5A7189;
  --line:#E3ECF3; --line-2:#D3E0EB; --line-3:#ADC4D6;
  --accent:#14486E; --accent-soft:#dcedf8; --hl:#FFF1B8; --hl-ink:#0f314c;
  --fa:#14486E; --fa-soft:#DCEDF8; --tt:#0B6B63; --tt-soft:#DCF1EE; --src:#7A4B0E; --src-soft:#F5EAD7;
  --btn:#0f314c; --btn-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,49,76,.06), 0 12px 28px -20px rgba(15,49,76,.5);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ---------- shared masthead, as Summit HQ ---------- */
.hq{overflow:hidden;background:var(--navy);color:#fff;display:flex;align-items:center;gap:0;padding:0 24px;min-height:64px;box-shadow:0 1px 0 rgba(80,164,219,.28)}
.plate{background:#fff;border-radius:5px;padding:9px 13px;display:flex;line-height:0;flex:0 0 auto}
/* the logo leads to www.mismo.org (a page read outside MISMO) and grows on hover (Perry, 7 Oct 2026) */
[data-mismo-home]{text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s ease;transform-origin:left center}[data-mismo-home]:hover,[data-mismo-home]:focus-visible{transform:scale(1.06)}[data-mismo-home]:focus-visible{outline:2px solid #50a4db;outline-offset:3px}

.plate svg{height:22px;width:auto}
.rule{width:2px;height:32px;margin-inline:18px;border-radius:1px;background:var(--sky);flex:0 0 auto}
.hqname{font-size:15.5px;font-weight:700;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hqsub{font-size:12.5px;color:rgba(255,255,255,.62);margin-left:12px;white-space:nowrap}
.hqr{margin-left:auto;display:flex;align-items:center;gap:10px}
.hqlink{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);text-decoration:none;padding:7px 10px;border-radius:4px;white-space:nowrap}
.hqlink:hover{background:rgba(255,255,255,.1)}
.dl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:7px 12px;white-space:nowrap}
.dl:hover{background:rgba(255,255,255,.1)}
.dl i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sky);color:var(--navy-deep);border-radius:3px;padding:1px 6px}

/* ---------- shared pieces ---------- */
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;border:0;line-height:1.5;white-space:nowrap;cursor:pointer}
.pill.fa{background:var(--fa-soft);color:var(--fa)}
.pill.tt{background:var(--tt-soft);color:var(--tt)}
.pill.src{background:var(--src-soft);color:var(--src)}
.pill:hover{filter:brightness(.97)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.fa{background:var(--fa)}.dot.tt{background:var(--tt)}.dot.src{background:var(--src)}
.btn{font-size:13px;font-weight:600;border-radius:4px;padding:7px 13px;cursor:pointer;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--line-3)}
.btn.p{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.sm{font-size:12px;padding:5px 10px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:12px 14px 12px 42px;font-size:16px}
.search input:focus{outline:2px solid var(--sky);outline-offset:-1px}
.empty{padding:28px 20px;color:var(--ink-3);text-align:center}
.def a,.def .tl{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;font-size:13px;font-weight:600;border-radius:6px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.more{display:flex;justify-content:center;padding:14px}

/* ================= A: Reference desk ================= */
.A-hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-mid) 140%);color:#fff;padding:34px 24px 30px}
.A-hero .in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.A-hero .eyebrow{color:var(--sky-soft)}
.A-hero h1{margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.1;letter-spacing:-.02em;text-wrap:balance;max-width:24ch}
.A-hero .search{max-width:720px}
.A-hero .search input{border-color:transparent;font-size:17px;padding-block:14px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.A-stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:rgba(255,255,255,.78)}
.A-stats b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.A-az{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line-2)}
.A-az .in{max-width:1180px;margin:0 auto;padding:6px 24px;display:flex;gap:2px;flex-wrap:wrap}
.A-az button{border:0;background:transparent;border-radius:4px;min-width:28px;padding:4px 6px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.A-az button:hover{background:var(--sunk)}
.A-az button[aria-pressed="true"]{background:var(--navy);color:#fff}
.A-az button:disabled{color:var(--line-3);cursor:default;background:none}
.A-body{max-width:1180px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.A-side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-height:780px){ .A-side.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px)} }
.A-grp{background:var(--surface);border:1px solid var(--line-2);border-radius:8px}
.A-grp summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.A-grp summary::-webkit-details-marker{display:none}
.A-grp summary small{margin-left:auto;color:var(--ink-3);font-weight:500}
.A-grp summary:after{content:"";width:8px;height:8px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);transform:rotate(45deg);margin:-3px 2px 0 6px}
.A-grp[open] summary:after{transform:rotate(-135deg);margin-top:3px}
.A-opts{padding:0 8px 8px;display:flex;flex-direction:column}
.A-opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 6px;border-radius:5px;font-size:13px;cursor:pointer}
.A-opt:hover{background:var(--paper)}
.A-opt input{margin:3px 0 0;accent-color:var(--navy)}
.A-opt .nm{overflow-wrap:anywhere}
.A-opt .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.A-opt.zero{opacity:.5}
.A-opt .ds{grid-column:2/-1;font-size:12px;color:var(--ink-2);line-height:1.45}
.A-mode{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.A-mode .sw{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.A-mode .sw button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.A-mode .sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,49,76,.15)}
.A-note{font-size:12px;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:10px 12px;line-height:1.5}
.A-main{min-width:0;display:flex;flex-direction:column;gap:12px}
.A-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.A-bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.A-chips{display:flex;gap:6px;flex-wrap:wrap}
.A-chips .pill:after{content:"×";margin-left:2px;font-weight:700}
.A-bar .clr{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.A-list{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.A-row{border-top:1px solid var(--line)}
.A-row:first-child{border-top:0}
.A-head{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;text-align:left;border:0;background:transparent;padding:13px 18px;cursor:pointer}
.A-head:hover{background:var(--paper)}
.A-head .t{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.A-head .ty{font-size:12px;color:var(--ink-3);white-space:nowrap;align-self:center}
.A-head .sn{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.A-row.open .A-head,.A-row.open .A-head:hover{background:transparent}
.A-row.open .A-head .sn{display:none}
.A-open{padding:0 18px 18px;background:transparent;display:flex;flex-direction:column;gap:12px}
.A-open .def{font-size:15.5px;line-height:1.65;max-width:72ch;margin:0}
.A-cls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.A-cls .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.A-cls .v{display:flex;gap:5px;flex-wrap:wrap}
.A-foot{display:flex;gap:8px;flex-wrap:wrap}

.A-tags{display:flex;gap:6px;flex-wrap:wrap}
/* ---------- the classifications panel: three treatments ---------- */
.S{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;display:flex;flex-direction:column}
.S-h{padding:16px 18px 4px}
.S-h h2{margin:0;font-size:16px;letter-spacing:-.005em}
.S-h p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.S-mode{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line)}
.S-mode .sw{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.S-mode .sw button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.S-mode .sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,49,76,.15)}
.S-note{font-size:12px;color:var(--ink-3);line-height:1.5;padding:12px 18px 16px;border-top:1px solid var(--line)}
.S-fold{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:13px 16px;cursor:pointer}
.S-fold span{font-weight:600;font-size:15px}.S-fold small{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.S-fold i{margin-left:auto;font-style:normal;font-weight:600;color:var(--accent);font-size:13px}
.S-clear{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;margin-left:auto}

/* 1 · Chips: one kind at a time, every value visible, and what it means below */
.K-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 18px 0;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.K-tabs button{border:0;background:transparent;border-radius:6px;padding:7px 6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.K-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,49,76,.14)}
.K-tabs b{flex:0 0 auto;font-size:10.5px;background:var(--navy);color:#fff;border-radius:999px;padding:0 6px;line-height:16px}
.K-cloud{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px}
.K-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 7px 5px 12px;font-size:13px;font-weight:500;cursor:pointer;max-width:100%}
.K-chip span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.K-chip small{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--sunk);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.K-chip:hover{border-color:var(--line-3)}
.K-chip.zero{opacity:.45}
.K-chip[aria-pressed="true"].fa{background:var(--fa);border-color:var(--fa);color:var(--surface)}
.K-chip[aria-pressed="true"].tt{background:var(--tt);border-color:var(--tt);color:var(--surface)}
.K-chip[aria-pressed="true"].src{background:var(--src);border-color:var(--src);color:var(--surface)}
.K-chip[aria-pressed="true"] small{background:rgba(255,255,255,.22);color:inherit}
.K-mean{margin:0 18px 16px;border-radius:8px;background:var(--paper);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:92px}
.K-mean .top{display:flex;align-items:baseline;gap:8px}
.K-mean b{font-size:14px}
.K-mean .n{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.K-mean p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}

/* 2 · Bars: each kind as a short ranked list, sized by how many terms it holds */
.R-grp{padding:12px 18px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.R-grp:first-of-type{border-top:0}
.R-grp h3{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.R-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.R-row:hover{background:var(--paper)}
.R-row .nm{font-size:13.5px;overflow-wrap:anywhere}
.R-row .n{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.R-row .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.R-row .bar i{display:block;height:100%;border-radius:2px}
.R-row.fa .bar i{background:var(--fa)}.R-row.tt .bar i{background:var(--tt)}.R-row.src .bar i{background:var(--src)}
.R-row[aria-pressed="true"]{background:var(--accent-soft)}
.R-row[aria-pressed="true"] .nm{font-weight:600}
.R-row[aria-pressed="true"] .nm:before{content:"✓ ";color:var(--accent)}
.R-row .ds{grid-column:1/-1;font-size:12.5px;color:var(--ink-2);line-height:1.45;padding-top:4px}
.R-row.zero{opacity:.5}
.R-more{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 8px}

/* 3 · Sentence: the filter reads as a sentence; each part opens a panel of choices */
.Q{padding:14px 18px 16px;font-size:15px;line-height:2.3;color:var(--ink-2)}
.Q-part{position:relative;display:inline-block}
.Q-part>button{border:0;border-bottom:2px solid currentColor;background:transparent;font-weight:600;font-size:15px;padding:0 2px;cursor:pointer;line-height:1.35}
.Q-part.fa>button{color:var(--fa)}.Q-part.tt>button{color:var(--tt)}.Q-part.src>button{color:var(--src)}
.Q-part>button:after{content:"▾";font-size:11px;margin-left:4px}
.Q-pop{position:absolute;top:calc(100% + 4px);right:-6px;z-index:30;width:min(460px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 40px -16px rgba(6,32,47,.45);padding:8px;line-height:1.4}
.Q-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}
.Q-opt{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:6px;padding:7px 9px;font-size:13px;cursor:pointer;color:var(--ink);min-width:0}
.Q-opt:hover,.Q-opt:focus-visible{background:var(--paper)}
.Q-opt .ck{flex:0 0 auto;width:16px;height:16px;border:1.5px solid var(--line-3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.Q-opt[aria-pressed="true"] .ck{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.Q-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.Q-opt small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.Q-opt.zero{opacity:.45}
.Q-desc{border-top:1px solid var(--line);margin-top:6px;padding:9px 9px 3px;font-size:12.5px;color:var(--ink-2);min-height:54px}
.Q-desc b{color:var(--ink)}
.Q-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 0;font-size:12px}
.Q-about{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}
.Q-about h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.Q-item{display:flex;flex-direction:column;gap:3px}
.Q-item .top{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.Q-item p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}

footer.g{border-top:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);font-size:12.5px}
footer.g .in{max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;gap:10px 24px;flex-wrap:wrap}

@media (max-width:980px){ .A-body{grid-template-columns:minmax(0,1fr)} .A-side{order:-1} .A-side.after{order:1} .A-side.stick{position:static} }
@media (max-width:720px){
  .hq{padding:0 14px;min-height:56px} .plate{padding:7px 10px} .plate svg{height:17px} .rule{margin-inline:12px;height:28px}
  .dl span,.dl i{display:none} .dl{padding:8px 10px} .hqname{font-size:14px}
  .A-az .in{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .A-az .in::-webkit-scrollbar{display:none}
  .A-hero{padding:24px 16px} .A-az .in{padding:6px 16px} .A-body{padding:16px 16px 40px}
  .A-head{padding:12px 14px} .A-open{padding:4px 14px 16px}
  
  .Q-grid{grid-template-columns:minmax(0,1fr)} .Q-pop{right:auto;left:-40px}
  footer.g .in{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---------- round three: hero spacing, the list's own header, and three sentences ---------- */
.A-hero{padding:28px 24px}
.A-hero .in{gap:22px}
.A-hero h1{max-width:760px;font-size:clamp(28px,3.3vw,42px);line-height:1.12}
.A-hero .search{max-width:760px}
.A-list{overflow:visible}
.L-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line-2);background:var(--sunk);border-radius:8px 8px 0 0}
.L-n{font-size:13.5px;color:var(--ink-2)}
.L-n b{color:var(--ink);font-variant-numeric:tabular-nums}
.L-head .S-clear{margin-left:auto}
.L-rows .A-row:first-child{border-top:0}

/* the blanks: tinted in their kind's colour, with a dashed rule so they read as fill-ins */

.Q-part>button{border:0;border-bottom:1.5px dashed currentColor;border-radius:5px 5px 0 0;font:inherit;font-weight:600;padding:0 7px;cursor:pointer;line-height:1.5}
.Q-part>button:after{content:"▾";font-size:.7em;margin-left:5px;opacity:.8}
.Q-part.fa>button{background:var(--fa-soft);color:var(--fa)}
.Q-part.tt>button{background:var(--tt-soft);color:var(--tt)}

.Q-part>button[aria-expanded="true"]{border-bottom-style:solid}
.Q-mode{white-space:nowrap}
.Q-mode button{border:0;border-bottom:1.5px dashed currentColor;background:var(--sunk);color:var(--ink);font:inherit;font-weight:600;padding:0 6px;cursor:pointer;border-radius:5px 5px 0 0;line-height:1.5}
.Q2 .Q-pop{left:0;right:auto}
.Q-item .top .cnt{margin-left:auto;font-weight:500;font-size:12px;color:var(--ink-3)}

/* 3: choices open in place under the sentence */
.Q-tray{margin:0 18px 14px;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--paper)}

.Q-chips{display:flex;flex-wrap:wrap;gap:6px}
.Q-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;cursor:pointer}
.Q-chip small{font-size:10.5px;font-weight:600;color:var(--ink-3);background:var(--sunk);border-radius:999px;padding:1px 6px}

.Q-chip[aria-pressed="true"].fa{background:var(--fa);border-color:var(--fa);color:var(--surface)}
.Q-chip[aria-pressed="true"].tt{background:var(--tt);border-color:var(--tt);color:var(--surface)}
.Q-chip[aria-pressed="true"].src{background:var(--src);border-color:var(--src);color:var(--surface)}
.Q-chip[aria-pressed="true"] small{background:rgba(255,255,255,.22);color:inherit}
.Q-tray .Q-desc{margin-top:8px;padding-inline:2px}

/* 2: the side lists every value, compactly */
.G-grp{border-top:1px solid var(--line);padding:12px 18px}

.G-list{display:flex;flex-wrap:wrap;gap:4px 12px}

.G-v small{color:var(--ink-3);font-size:11.5px}
.G-v:hover{color:var(--accent);text-decoration:underline}
.G-v[aria-pressed="true"]{font-weight:700}
.G-v.fa[aria-pressed="true"]{color:var(--fa)}.G-v.tt[aria-pressed="true"]{color:var(--tt)}.G-v.src[aria-pressed="true"]{color:var(--src)}
.G-v.zero{opacity:.45}
@media (max-width:720px){ .A-hero{padding:22px 16px} .A-hero .in{gap:16px} .L-head,.L-foot{padding-inline:14px} .Q2{font-size:16px} }

/* round four: the sentence as clean text, one part per line */
.Q1{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:2px;align-items:center;font-size:16px;line-height:1.5;padding:10px 18px 18px}
.Q-w{font-size:13.5px;color:var(--ink-3);text-align:right}
.Q1 .Q-part{display:block;min-width:0}
.Q1 .Q-part>button{display:inline-flex;align-items:center;gap:7px;max-width:100%;margin-left:-8px;padding:5px 8px;border:0;border-radius:6px;background:transparent;font:inherit;font-weight:600;cursor:pointer;line-height:1.4;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:color-mix(in srgb,currentColor 32%,transparent)}
.Q1 .Q-part>button:after{content:none}
.Q1 .Q-part.fa>button,.Q1 .Q-part.tt>button,.Q1 .Q-part.src>button{background:transparent}
.Q1 .Q-part>button:hover,.Q1 .Q-part>button[aria-expanded="true"]{background:var(--paper);text-decoration-color:currentColor}
.Q1 .Q-part.md>button{color:var(--ink)}
.Q1 .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:12px;height:12px;flex:0 0 auto;opacity:.75}
.Q1 .Q-pop{left:-8px;right:auto}

/* pills everywhere: one quiet shape, the kind told by a small coloured dot */
.pill,.pill.fa,.pill.tt,.pill.src{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);font-weight:500;padding:2px 10px 2px 9px;gap:6px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--ink-3)}
.pill.fa:before{background:var(--fa)}.pill.tt:before{background:var(--tt)}.pill.src:before{background:var(--src)}
.pill:hover{filter:none;border-color:var(--line-3)}
.A-chips .pill:after{color:var(--ink-3);font-weight:500;margin-left:3px}
/* Sources: two columns and the same width as the others; long names wrap onto a second line. */
.Q-pop.one .Q-opt .nm{white-space:normal;overflow:visible}
@media (max-width:720px){ .Q-pop.one .Q-grid{grid-template-columns:minmax(0,1fr)} }

/* round five: one section per classification */
.C-sec{border-top:1px solid var(--line);padding:14px 18px 16px;display:flex;flex-direction:column;gap:6px}

.C-top{display:flex;align-items:center;gap:10px;min-width:0}
.C-top h3{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.C-top .Q-part{position:relative;margin-left:auto;min-width:0;display:block;flex:0 1 auto}
.C-top .Q-part>button{display:inline-flex;align-items:center;gap:6px;max-width:none;padding:4px 8px;margin-right:-8px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:14px;font-weight:600;cursor:pointer;line-height:1.4;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-color:color-mix(in srgb,currentColor 32%,transparent)}
.C-top .Q-part>button:after{content:none}
.C-top .Q-part.fa>button,.C-top .Q-part.tt>button,.C-top .Q-part.src>button{background:transparent}
.C-top .Q-part>button:hover,.C-top .Q-part>button[aria-expanded="true"]{background:var(--paper);text-decoration-color:currentColor}
.C-top .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.C-top .Q-pop{right:0;left:auto}
.C-def{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.C-pick{border-left:2px solid var(--line-2);padding:2px 0 2px 12px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.C-sec.fa .C-pick{border-left-color:var(--fa)}.C-sec.tt .C-pick{border-left-color:var(--tt)}.C-sec.src .C-pick{border-left-color:var(--src)}
.C-pick .top{display:flex;align-items:center;gap:8px;font-size:13.5px}
.C-pick .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.C-pick .x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.C-pick .x:hover{color:var(--ink)}
.C-pick p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.C-mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:12px 18px 14px;border-top:1px solid var(--line)}
.C-mode .sw{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.C-mode .sw button{border:0;background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer}
.C-mode .sw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,49,76,.15)}
.C-mode .S-clear{margin-left:auto}

/* also known as, and related terms, inside an open term */
.A-links{margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.A-links div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:baseline}
.A-links dt{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.A-links dd{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.A-links .lk{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-align:left}

/* ---------- round eight: the line under the search, flush with it ---------- */
.A-hero .in>*{width:100%;max-width:920px}
.A-hero .search{max-width:920px}
.A-meta{font-size:13px;color:rgba(255,255,255,.78)}

.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--sky)}
.stat.cp .sdot{background:#E0A83C}
/* A: one line, counts on the left edge and the status on the right edge */
.M-a{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap}
.M-a .nums{display:flex;gap:14px;flex-wrap:wrap}
.M-a .stat{display:inline-flex;align-items:center;gap:8px;color:#fff}
/* B: four equal cells the width of the search, the status beneath */
.M-b{display:flex;flex-direction:column;gap:12px}
.M-b .cells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid rgba(255,255,255,.16);border-radius:6px;overflow:hidden}
.M-b .cells div{display:flex;flex-direction:column;gap:1px;padding:10px 14px;border-left:1px solid rgba(255,255,255,.16)}

.M-b .cells span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.M-b .stat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:rgba(255,255,255,.85)}

/* C: a panel joined to the bottom of the search box */
.A-hero[data-sv="c"] .in{gap:0}

.M-c .stat{display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,.88)}
.M-c .nums{display:flex;gap:6px;flex-wrap:wrap;color:rgba(255,255,255,.72)}

@media (max-width:720px){ .M-b .cells{grid-template-columns:repeat(2,minmax(0,1fr))} .M-b .cells div:nth-child(3){border-left:0} .M-b .cells div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.16)} }

/* The underline is a rule under the words, not a text underline: a text underline breaks
   around descenders, and "All types" (y, p) came out with almost none. */
.C-top .Q-part>button{text-decoration:none}
.C-top .lbl{border-bottom:1.5px solid color-mix(in srgb,currentColor 45%,transparent);padding-bottom:2px}

:root{color-scheme:light}

/* ===================================================================================== the MISMO website template
   (Jonna, 21 Oct 2026; MISMO-Page-Template.html and MISMO-Website-Style-Guide.md, measured from the live Home page).
   Everything below wins over the older styles above it. */
:root{
  --mm-font:"IBM Plex Sans","Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --mm-ink:#0d314c;        /* headings, body ink */
  --mm-hero:#071d2e;       /* header bar and hero background */
  --mm-pill:#0f314c;       /* Log in button */
  --mm-blue:#1a8fe3;       /* primary buttons, links, focus */
  --mm-blue-top:#2e9dee;   /* primary button gradient top */
  --mm-sky:#74bfeb;        /* eyebrow, second line of hero title */
  --mm-sky-2:#56b4f2;      /* hero side list */
  --mm-sub:#a9d8f3;        /* hero sub text */
  --mm-text:#44607a;       /* body copy on white */
  --mm-line:#cfdeeb;       /* input borders, dividers */
  --mm-tag-bg:#e3f1fc;     /* tag background */
  --mm-tag-ink:#1a74b8;    /* tag text */
  --mm-page:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--mm-font);color:var(--mm-ink);background:var(--mm-page);font-size:16px;line-height:1.6}

/* ---------- Header bar (70px, dark navy, logo left, nav, Log in pill right) ---------- */
.mm-header{position:relative;z-index:5;height:70px;background:var(--mm-hero);box-shadow:0 2px 4px 0 rgba(0,0,0,.1),0 0 2px 0 rgba(153,153,153,.25);display:flex;align-items:center;padding:0 50px;gap:56px}
.mm-logo img{display:block;width:194px;height:36px;max-width:100%;object-fit:contain;object-position:left center} /* the logo file is 684x108; "contain" keeps its shape, as the live site does (it shows about 194x31). Never let it stretch to fill 194x36. */
.mm-logo{flex:0 1 194px;min-width:0}
.mm-nav{display:flex;align-items:stretch;height:70px;margin:0;padding:0;list-style:none;flex:1 1 auto}
.mm-nav>li{position:relative;display:flex;align-items:center;list-style:none}
.mm-nav-link{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;font-family:var(--mm-font);font-size:15px;font-weight:500;line-height:21px;color:#ffffff;text-decoration:none;white-space:nowrap}
.mm-nav>li:hover>.mm-nav-link,.mm-nav-link:focus-visible{color:var(--mm-sky)}
.mm-chev{width:11px;height:8px}
/* Dropdown menus: measured from the live site (opens on hover or keyboard focus) */
.mm-dd{display:none;position:absolute;left:0;top:100%;z-index:20;min-width:250px;margin:0;padding:8px 0;list-style:none;background:#0b2740;border-top:2px solid var(--mm-blue);border-radius:0 0 8px 8px;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
.mm-nav>li:hover>.mm-dd,.mm-nav>li:focus-within>.mm-dd{display:block}
.mm-dd a{display:block;padding:10px 18px 10px 16px;border-left:2px solid transparent;font-family:var(--mm-font);font-size:15px;font-weight:500;line-height:19.5px;color:#e6eef5;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.mm-dd a:hover,.mm-dd a:focus-visible{outline:none;background:rgba(116,191,235,.1);border-left-color:var(--mm-sky);color:var(--mm-sky)}
.mm-login{margin-left:auto;display:inline-block;padding:10px 20px;border-radius:50px;background:var(--mm-pill);color:#ffffff;font-family:var(--mm-font);font-size:16px;font-weight:600;line-height:16px;text-decoration:none;white-space:nowrap;min-width:max-content}
.mm-burger{display:none;width:40px;height:40px;margin-left:12px;padding:9px 8px;border:0;border-radius:6px;background:transparent;cursor:pointer}
.mm-burger span{display:block;height:2px;margin:4px 0;border-radius:2px;background:#ffffff;transition:transform .2s,opacity .2s}
/* Phones and tablets: hamburger shows the same menu as a panel under the bar, sub-pages listed under each heading */
@media (max-width:1100px){
  .mm-header{padding:0 20px;gap:12px}
  .mm-burger{display:block}
  .mm-nav{display:none}
  .mm-header.is-open .mm-nav{display:block;position:absolute;top:70px;left:0;right:0;height:auto;max-height:calc(100vh - 70px);overflow-y:auto;padding:8px 0 16px;background:#0b2740;border-top:2px solid var(--mm-blue);box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
  .mm-header.is-open .mm-nav>li{display:block}
  .mm-header.is-open .mm-nav-link{display:flex;padding:12px 20px 6px;font-weight:600}
  .mm-header.is-open .mm-chev{display:none}
  .mm-header.is-open .mm-dd{display:block;position:static;min-width:0;padding:0 0 6px;background:transparent;border:0;border-radius:0;box-shadow:none}
  .mm-header.is-open .mm-dd a{padding:9px 20px 9px 34px;white-space:normal}
  .mm-header.is-open .mm-burger span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .mm-header.is-open .mm-burger span:nth-child(2){opacity:0}
  .mm-header.is-open .mm-burger span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
}

/* ---------- Page sections ---------- */
.mm-section{max-width:1120px;margin:0 auto;padding:56px clamp(20px,5vw,48px)}
.mm-eyebrow{margin:0 0 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--mm-blue)}
.mm-h2{margin:0 0 12px;font-size:38px;font-weight:700;line-height:1.2;color:var(--mm-ink)}
.mm-lede{margin:0 0 28px;font-size:16px;line-height:1.6;color:var(--mm-text);max-width:62ch}

/* ---------- Form ---------- */
.mm-form{max-width:720px;background:#ffffff;border:1px solid var(--mm-line);border-radius:12px;padding:28px;box-shadow:0 14px 34px -22px rgba(7,29,46,.35)}
.mm-field{margin:0 0 18px}
.mm-label{display:block;margin:0 0 6px;font-size:14px;font-weight:600;color:var(--mm-ink)}
.mm-hint{display:block;margin:4px 0 0;font-size:13px;color:var(--mm-text)}
.mm-input,.mm-select,.mm-textarea{width:100%;height:44px;padding:0 14px;font-family:var(--mm-font);font-size:15px;color:var(--mm-ink);background:#ffffff;border:1px solid var(--mm-line);border-radius:8px;outline:none}
.mm-textarea{height:auto;min-height:120px;padding:12px 14px;line-height:1.5;resize:vertical}
.mm-input:focus,.mm-select:focus,.mm-textarea:focus{border-color:var(--mm-blue);box-shadow:0 0 0 3px rgba(26,143,227,.18)}
.mm-row{display:flex;flex-wrap:wrap;gap:16px}.mm-row>.mm-field{flex:1 1 240px}
.mm-check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--mm-text)}
.mm-check input{margin-top:4px;accent-color:var(--mm-blue)}
.mm-tag{display:inline-block;padding:3px 8px;border-radius:4px;background:var(--mm-tag-bg);color:var(--mm-tag-ink);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ---------- Buttons (never wrap) ---------- */
.mm-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.mm-btn{display:inline-block;box-sizing:border-box;min-width:max-content;white-space:nowrap;text-align:center;padding:14px 22px;border-radius:8px;font-family:var(--mm-font);font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;cursor:pointer}
.mm-btn-primary{background:linear-gradient(180deg,var(--mm-blue-top) 0%,var(--mm-blue) 100%);box-shadow:0 5px 16px -4px rgba(26,143,227,.55);color:#ffffff;border:1.5px solid var(--mm-blue)}
.mm-btn-secondary{background:#ffffff;color:var(--mm-blue);border:1.5px solid var(--mm-blue)}

/* ---------- Footer (simple) ---------- */
.mm-footer{background:var(--mm-hero);color:rgba(255,255,255,.85);font-size:14px}
.mm-footer-in{max-width:1120px;margin:0 auto;padding:28px clamp(20px,5vw,48px);display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;justify-content:space-between}
.mm-footer a{color:#ffffff}

/* Desktop rules the live site applies to every hero (from the shared stylesheet):
   the hero is 502px tall with 40px top and bottom padding, and hero buttons are only as wide as their text. */
div[style*="min-height: clamp(380px"]{min-height:502px !important;padding-top:40px !important;padding-bottom:40px !important}
div[style*="max-width: 560px"] > a{flex:0 0 auto !important}
/* Phone rules the live site applies to every hero (from the shared stylesheet) */
@media (max-width:600px){
  div[style*="min-height: clamp(380px"]{min-height:0 !important;padding:30px 20px !important}
  div[style*="flex: 0 1 200px"]{display:flex !important;flex-wrap:wrap;gap:4px 16px;border-left:0 !important;padding-left:0 !important;min-width:0 !important}
  div[style*="flex: 0 1 200px"] > div:nth-child(n+5){display:none !important}
  div[style*="max-width: 560px"] > a{flex:0 0 100% !important}
}
@media (max-width:600px){.mm-h2{font-size:30px}.mm-form{padding:20px}.mm-btn{flex:1 1 100%}}

:focus-visible{outline:2px solid var(--mm-blue);outline-offset:2px}

.mm-nav-link:focus-visible,.mm-login:focus-visible{outline:2px solid var(--mm-sky);outline-offset:2px;border-radius:6px}

.mm-footer{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:1100px){ .mm-header.is-open .mm-nav{top:100%} }

@media (max-width:600px){ div[style*="max-width: 560px"] > button{flex:0 0 100% !important} }

<div class="gl-cards"><a class="gl-card" href="${DL_URL}" target="_blank" rel="noopener" title="Opens MISMO Connect. Signing in is required."><b>Download the Glossary</b><span>The full release workbook, version ${esc(D.meta.label||'')} ${D.meta.stage==='final'?'Final':D.meta.stage==='comment-period'?'(30-Day Comment Period)':''}, with every term and its classifications.</span><span class="f"><span class="who">Members Only</span><span class="go">Download&nbsp;&rarr;</span></span></a><${SUGGEST_LIVE?'button type="button" data-suggest':'div aria-disabled="true"'} class="gl-card"><b>Suggest a Term</b><span>Missing a term, or one that could be clearer? Tell the glossary team.</span><span class="f"><span class="who">Open to Everyone</span><span class="go${SUGGEST_LIVE?'':' soon'}">${SUGGEST_LIVE?'Suggest&nbsp;&rarr;':'Coming Soon'}</span></span></${SUGGEST_LIVE?'button':'div'}></div>
</div>
</div>
    <section class="gl-sec"><div class="gl-head"><div><p class="mm-eyebrow">${n(T.length)} Terms</p><h2 class="mm-h2">Search the Glossary</h2><p class="mm-lede">Type a term, a phrase or an acronym, or browse by letter. <span id="aStats"></span></p></div></div>
      <label class="search"><span class="vh">Search the glossary</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="aQ" type="search" placeholder="Search ${n(T.length)} terms and definitions" autocomplete="off"><button type="button" class="qx" id="aQx" aria-label="Clear the search" tabindex="-1"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></label></section>
    <nav class="A-az" aria-label="Jump to a letter"><div class="in" id="aAz"></div></nav>
    <div class="A-body"><section class="A-main" id="aMain" aria-live="polite"></section><aside class="A-side" id="aSide" aria-label="Classifications"></aside></div>`+footer;
  /* Phone and tablet menu: the hamburger opens the same menu as a panel under the header bar. */
(function(){var h=document.querySelector(".mm-header"),b=h.querySelector(".mm-burger");b.addEventListener("click",function(){var o=h.classList.toggle("is-open");b.setAttribute("aria-expanded",o?"true":"false");b.setAttribute("aria-label",o?"Close menu":"Open menu");});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&h.classList.contains("is-open")){h.classList.remove("is-open");b.setAttribute("aria-expanded","false");b.focus();}});})();
  const syncQx=()=>$('aQx').classList.toggle('on',!!$('aQ').value);
  const clearQ=()=>{ $('aQ').value=''; syncQx(); A.st.q=''; A.shown=40; A.open=null; paint(); setHash(null); $('aQ').focus(); };
  $('aQx').addEventListener('click',e=>{ e.preventDefault(); clearQ(); });
  $('aQ').addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('aQ').value){ e.preventDefault(); e.stopPropagation(); clearQ(); } });
  let tm; $('aQ').addEventListener('input',e=>{ syncQx(); clearTimeout(tm); tm=setTimeout(()=>{ A.st.q=e.target.value; A.shown=40; A.open=null; paint(); },120); });
  R.addEventListener('click',e=>{
    const L=e.target.closest('[data-letter]'); if(L){ A.st.letter=A.st.letter===L.dataset.letter?'':L.dataset.letter; A.shown=40; paint(); return; }
    const tg=e.target.closest('[data-toggle]'); if(tg){ const [k,x]=tg.dataset.toggle.split(':'); toggle(k,+x); A.popHover=tg.dataset.toggle; paint(true); return; }
    const p=e.target.closest('[data-pick]'); if(p){ const [k,x]=p.dataset.pick.split(':'); A.st.sel[k].add(+x); A.shown=40; paint(); window.scrollTo({top:$('aMain').offsetTop-100,behavior:'smooth'}); return; }
    const un=e.target.closest('[data-unpick]'); if(un){ const [k,x]=un.dataset.unpick.split(':'); A.st.sel[k].delete(+x); paint(); return; }
    const h=e.target.closest('[data-row]'); if(h){ A.open=A.open===+h.dataset.row?null:+h.dataset.row; paintMain(); setHash(A.open==null?null:T[A.open]); return; }
    const g=e.target.closest('[data-go]'); if(g){ const t=T[+g.dataset.go]; A.st=newState(); A.st.q=t.term; $('aQ').value=t.term; A.open=t.i; paint(); setHash(t); window.scrollTo({top:$('aMain').offsetTop-80,behavior:'smooth'}); return; }
    const m=e.target.closest('[data-mode]'); if(m){ A.st.mode=m.dataset.mode; paint(true); return; }
    const qp=e.target.closest('[data-qpart]'); if(qp){ const k=qp.dataset.qpart;
      if(A.v==='3'){ A.tray=A.tray===k?null:k; A.popHover=null; paint(); return; }
      A.pop=A.pop===k?null:k; A.popHover=null; paint(); const f=document.querySelector('.Q-pop .Q-opt'); if(f) f.focus({preventScroll:true}); return; }
    if(e.target.closest('[data-qdone]')){ const k=A.pop||A.tray; A.pop=null; A.tray=null; paint(); const b=document.querySelector(`[data-qpart="${k}"]`); if(b) b.focus({preventScroll:true}); return; }
    const qa=e.target.closest('[data-qall]'); if(qa){ A.st.sel[qa.dataset.qall].clear(); paint(true); return; }
    if(e.target.closest('[data-fold]')){ A.sideOpen=!A.sideOpen; paintSide(); return; }
    if(e.target.closest('[data-clearcls]')){ ['fa','tt','src'].forEach(k=>A.st.sel[k].clear()); paint(); return; }
    if(e.target.closest('[data-clearall]')){ A.st=newState(); $('aQ').value=''; A.open=null; A.pop=null; A.tray=null; paint(); return; }
    if(e.target.closest('#aMore')){ A.shown+=40; paintMain(); return; }
    const cp=e.target.closest('[data-copy]'); if(cp){ copyLink(T[+cp.dataset.copy]); }
  });
  /* The meaning of a value follows the pointer and the keyboard: reading it never takes a click. */
  const hov=e=>{ const c=e.target.closest&&e.target.closest('[data-toggle]'); if(!c||A.popHover===c.dataset.toggle) return; A.popHover=c.dataset.toggle; paintQDesc(); };
  R.addEventListener('mouseover',hov); R.addEventListener('focusin',hov);
  document.addEventListener('mousedown',e=>{ if(A.pop&&!e.target.closest('.Q-part')){ A.pop=null; paint(); } });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(A.pop||A.tray)){ const k=A.pop||A.tray; A.pop=null; A.tray=null; paint(); const b=document.querySelector(`[data-qpart="${k}"]`); if(b) b.focus(); } });
}
function setHash(t){ try{ history.replaceState(null,'',t?'#'+t.slug:location.pathname+location.search); }catch(e){} }
function toggle(k,x){ A.st.sel[k].has(x)?A.st.sel[k].delete(x):A.st.sel[k].add(x); A.shown=40; }
/* keep: a tick inside an open panel redraws around it and keeps the focus where it was. */
function paint(keep){
  if($('aQx')) $('aQx').classList.toggle('on',!!$('aQ').value);
  const f=keep&&document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.toggle:null;
  A.res=run(A.st); paintAz(); paintMain(); paintSide(); fitPop();
  if(f){ const el=document.querySelector(`[data-toggle="${f}"]`); if(el) el.focus({preventScroll:true}); }
}
function paintAz(){
  const q=A.st.q.trim().toLowerCase(); const has=new Set(T.filter(t=>rank(t,q)>=0).map(t=>t.letter));
  $('aAz').innerHTML=`<button type="button" data-letter="" aria-pressed="${!A.st.letter}">All</button>`+LETTERS.map(l=>`<button type="button" data-letter="${l}" aria-pressed="${A.st.letter===l}"${has.has(l)?'':' disabled'}>${l}</button>`).join('');
}
const picked=()=>['fa','tt','src'].reduce((s,k)=>s+A.st.sel[k].size,0);
const byCount=(k,c)=>V[k].map((v,x)=>({v,x,c:c[k][x],key:k+':'+x})).sort((a,b)=>b.c-a.c||a.v.localeCompare(b.v));
const noteHTML=`<div class="S-note"><b>Two similar names.</b> #MBAGlossary is a focus area and MBA Glossary is a source. Both come from the MBA glossary, recorded in two different fields.</div>`;
const GUIDE={tt:'What kind of thing a term is, such as Data, a Document, a Process, an Actor or a Regulation.',fa:'The part of the mortgage business a term belongs to. A term can have several focus areas.',src:'Where the definition comes from, such as MISMO’s Data Dictionary or the MBA Glossary.'};
/* When more than one thing is picked, "and" or "or" is itself a blank in the sentence. */
const modeBlank=()=>picked()>1?`<span class="Q-mode">matching <button type="button" data-mode="${A.st.mode==='all'?'any':'all'}" title="Switch between matching all and any">${A.st.mode==='all'?'all':'any'} ▾</button> of them</span>`:'';
const CHEV='<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5L6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function part(k){
  return `<span class="Q-part ${k}"><button type="button" data-qpart="${k}" aria-expanded="${A.pop===k||A.tray===k}" aria-haspopup="true"><span class="lbl">${esc(blankLabel(k))}</span>${CHEV}</button>${A.pop===k?popHTML(k):''}</span>`;
}
/* Read down the left: "Show / in / from", with the choices lined up beside them. */
const sentence=()=>`<span class="Q-w">Show</span>${part('tt')}<span class="Q-w">in</span>${part('fa')}<span class="Q-w">from</span>${part('src')}`+
  (picked()>1?`<span class="Q-w">matching</span><span class="Q-part md"><button type="button" data-mode="${A.st.mode==='all'?'any':'all'}" title="Switch between matching all and any of these"><span class="lbl">${A.st.mode==='all'?'all of these':'any of these'}</span>${CHEV}</button></span>`:'');
/* How a section's drop-down reads: nothing picked, one, two, or a count. */
function pickLabel(k){ const s=[...A.st.sel[k]].map(x=>V[k][x]);
  return !s.length?(k==='tt'?'All types':k==='fa'?'All focus areas':'All sources'):s.length<=2?s.join(', '):`${s.length} selected`; }
function sectionHTML(k){
  const s=[...A.st.sel[k]];
  return `<section class="C-sec ${k}"><div class="C-top"><h3><span class="dot ${k}"></span>${KIND[k].one}</h3>
      <span class="Q-part ${k}"><button type="button" data-qpart="${k}" aria-expanded="${A.pop===k}" aria-haspopup="true" aria-label="${KIND[k].one}: ${esc(pickLabel(k))}"><span class="lbl">${esc(pickLabel(k))}</span>${CHEV}</button>${A.pop===k?popHTML(k):''}</span></div>
    <p class="C-def">${GUIDE[k]}</p>
    ${s.map(x=>`<div class="C-pick"><div class="top"><b>${esc(V[k][x])}</b><span class="cnt">${n(COUNT[k][x])} terms</span><button type="button" class="x" data-unpick="${k}:${x}" aria-label="Remove ${esc(V[k][x])}">×</button></div><p>${esc(desc(k,V[k][x])||'No description has been published yet.')}</p></div>`).join('')}</section>`;
}
/* Only with more than one pick: whether a term must match all of them or any one. */
const modeRow=()=>picked()>1?`<div class="C-mode">Show terms that match<span class="sw"><button type="button" data-mode="all" aria-pressed="${A.st.mode==='all'}">all</button><button type="button" data-mode="any" aria-pressed="${A.st.mode==='any'}">any</button></span>of these<button type="button" class="S-clear" data-clearcls>Clear</button></div>`:'';
function aboutHTML(){
  const sel=['tt','fa','src'].flatMap(k=>[...A.st.sel[k]].map(x=>[k,x]));
  return `<div class="Q-about"><h3>${sel.length?'About your choices':'What the blanks mean'}</h3>${sel.length?sel.map(([k,x])=>`<div class="Q-item"><div class="top"><span class="dot ${k}"></span>${esc(V[k][x])}<span class="cnt">${n(COUNT[k][x])} terms</span><button type="button" class="x" data-unpick="${k}:${x}" aria-label="Remove ${esc(V[k][x])}">×</button></div><p>${esc(desc(k,V[k][x])||'No description has been published yet.')}</p></div>`).join('')
    :['tt','fa','src'].map(k=>`<div class="Q-item"><div class="top"><span class="dot ${k}"></span>${KIND[k].one}</div><p>${GUIDE[k]}</p></div>`).join('')}</div>`;
}
function popHTML(k){
  const c=facetCounts(A.st);
  return `<div class="Q-pop${k==='src'?' one':''}" role="dialog" aria-label="${KIND[k].label}"><div class="Q-grid">${byCount(k,c).map(o=>`<button type="button" class="Q-opt${o.c?'':' zero'}" data-toggle="${o.key}" aria-pressed="${A.st.sel[k].has(o.x)}"><span class="ck">✓</span><span class="nm">${esc(o.v)}</span><small>${n(o.c)}</small></button>`).join('')}</div>
    <div class="Q-desc" id="qDesc" aria-live="polite">${qDescHTML(k)}</div>
    <div class="Q-foot"><button type="button" class="S-clear" style="margin:0" data-qall="${k}">${A.st.sel[k].size?'Clear these':''}</button><button type="button" class="btn sm p" data-qdone>Done</button></div></div>`;
}
function qDescHTML(k){ const key=A.popHover&&A.popHover.startsWith(k+':')?A.popHover:null;
  if(!key) return `Point at a ${KIND[k].one.toLowerCase()} to read what it means. Pick as many as you like.`;
  const [kk,x]=key.split(':'); return `<b>${esc(V[kk][+x])}.</b> ${esc(desc(kk,V[kk][+x])||'No description has been published yet.')}`; }
function paintQDesc(){ const el=$('qDesc'); const k=A.pop||A.tray; if(el&&k) el.innerHTML=qDescHTML(k); }
/* A panel of choices never runs off either side of the screen. */
function fitPop(){ const p=document.querySelector('.Q-pop'); if(!p) return; p.style.transform=''; const r=p.getBoundingClientRect(); let dx=0;
  if(r.right>innerWidth-12) dx=innerWidth-12-r.right; if(r.left+dx<12) dx=12-r.left; if(dx) p.style.transform=`translateX(${dx}px)`; }

function paintSide(){
  const S=$('aSide');
  S.classList.toggle('stick',!A.pop);
  S.classList.toggle('after',A.v==='2');
  const hide='';
  if(A.v==='1') S.innerHTML=`<div class="S"><div class="S-h"><h2>Narrow the List${hide}</h2><p>Every term has a type, one or more focus areas, and a source.</p></div>${['tt','fa','src'].map(sectionHTML).join('')}${modeRow()}</div>`;
  if(A.v==='2') S.innerHTML=`<div class="S"><div class="S-h"><h2>Classifications</h2><p>Every term has a type, one or more focus areas, and a source.</p></div>${aboutHTML()}${guideLists()}${noteHTML}</div>`;
  if(A.v==='3') S.innerHTML=`<div class="S"><div class="S-h"><h2>Narrow the List${hide}</h2><p>Select a highlighted part to fill it in.</p></div><div class="Q Q3">${sentence()}</div>${A.tray?trayHTML(A.tray):''}${aboutHTML()}${noteHTML}</div>`;
}
/* Version 2 keeps the sentence with the list; this side lists every value to pick from. */
function guideLists(){
  const c=facetCounts(A.st);
  return ['tt','fa','src'].map(k=>`<div class="G-grp"><h3><span class="dot ${k}"></span>${KIND[k].label}</h3><div class="G-list">${byCount(k,c).map(o=>`<button type="button" class="G-v ${k}${o.c?'':' zero'}" data-toggle="${o.key}" aria-pressed="${A.st.sel[k].has(o.x)}" title="${esc(desc(k,o.v))}">${esc(o.v)}<small>${n(o.c)}</small></button>`).join('')}</div></div>`).join('');
}
/* Version 3: the choices open in place under the sentence, pushing the panel down rather than covering it. */
function trayHTML(k){
  const c=facetCounts(A.st);
  return `<div class="Q-tray"><div class="Q-trayh">Choose ${KIND[k].label.toLowerCase()}<button type="button" class="S-clear" data-qall="${k}">${A.st.sel[k].size?'Clear':''}</button></div>
    <div class="Q-chips">${byCount(k,c).map(o=>`<button type="button" class="Q-chip ${k}${o.c?'':' zero'}" data-toggle="${o.key}" aria-pressed="${A.st.sel[k].has(o.x)}">${esc(o.v)}<small>${n(o.c)}</small></button>`).join('')}</div>
    <div class="Q-desc" id="qDesc" aria-live="polite">${qDescHTML(k)}</div>
    <div class="Q-foot"><span></span><button type="button" class="btn sm p" data-qdone>Done</button></div></div>`;
}

const akaAll=t=>t.aka.concat((t.akaBack||[]).filter(x=>!t.aka.includes(x)));
const relAll=t=>t.rel.concat((t.relBack||[]).filter(x=>!t.rel.includes(x)));
function linksHTML(t){
  const item=a=>typeof a==='string'?`<span class="lk-t">${esc(a)}</span>`:`<button type="button" class="lk" data-go="${a.i}">${esc(a.term)}</button>`;
  const aka=akaAll(t), rel=relAll(t);
  if(!aka.length&&!rel.length) return '';
  return `<dl class="A-links">${aka.length?`<div><dt>Also known as</dt><dd>${aka.map(item).join('<span class="sep">·</span>')}</dd></div>`:''}${rel.length?`<div><dt>Related terms</dt><dd>${rel.map(item).join('<span class="sep">·</span>')}</dd></div>`:''}</dl>`;
}
/* ----- the list: the count and the active filters are the box's own header ----- */
function paintMain(){
  const res=A.res, st=A.st, q=st.q.trim();
  const chips=['fa','tt','src'].flatMap(k=>[...st.sel[k]].map(x=>`<button type="button" class="pill ${k}" data-unpick="${k}:${x}" title="Remove this filter">${esc(V[k][x])}</button>`)).join('');
  const any=q||picked()||st.letter;
  const count=`<span class="L-n"><b>${n(res.length)}</b> ${res.length===1?'term':'terms'}${st.letter?` starting with ${st.letter}`:''}${q?` for “${esc(q)}”`:''}</span>`;
  const head=A.v==='2'
    ? `<div class="L-head L-sent"><div class="Q Q2">${sentence()}</div><div class="L-sub">${count}${any?'<button type="button" class="S-clear" data-clearall>Clear all</button>':''}</div></div>`
    : `<div class="L-head">${count}<span class="A-chips">${chips}</span>${any?'<button type="button" class="S-clear" data-clearall>Clear all</button>':''}</div>`;
  const rows=res.slice(0,A.shown).map(t=>{ const open=A.open===t.i;
    return `<div class="A-row${open?' open':''}"><button type="button" class="A-head" data-row="${t.i}" aria-expanded="${open}"><span class="t">${hl(t.term,q)}${akaAll(t).length&&!open?`<span class="aka">also ${esc(akaAll(t).map(a=>typeof a==='string'?a:a.term).join(', '))}</span>`:''}</span><span class="ty">${esc(t.tt.map(x=>V.tt[x]).join(', '))}</span><span class="sn">${hl(t.def,q)}</span></button>
      ${open?`<div class="A-open"><p class="def">${renderDef(t.def,q)}</p>${linksHTML(t)}
        <div class="A-tags">${['tt','fa','src'].map(k=>pills(k,t)).join('')}</div></div>`:''}</div>`; }).join('');
  $('aMain').innerHTML=`<div class="A-list">${head}<div class="L-rows">${rows||`<div class="empty">No terms match. ${st.mode==='all'&&picked()>1?'Try matching any of them, or remove one.':'Try a different search.'}</div>`}</div>
    ${res.length>A.shown?`<div class="L-foot"><span>Showing ${n(A.shown)} of ${n(res.length)}</span><button type="button" class="btn sm" id="aMore">Show ${n(Math.min(40,res.length-A.shown))} more</button></div>`:''}</div>`;
}

/* ---------- start ---------- */
function openFromHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,'')); const t=h&&bySlug.get(h); if(!t) return;
  A.st=newState(); A.st.q=t.term; $('aQ').value=t.term; A.open=t.i; paint();
  requestAnimationFrame(()=>{ const r=document.querySelector('.A-row.open'); if(r) r.scrollIntoView({block:'center'}); });
}
window.addEventListener('hashchange',openFromHash);
build(); A.v='1'; paint();

/* ---------- the status of the latest version, and the three ways of showing it ---------- */
/* Set by the console when a version is published: Final, or out for a 30-Day Comment
   Period, and the date. A file published before that existed has neither, and the line then
   just gives the date. */
const STAGE_KEY={'final':'f','comment-period':'cp'};
const STATUS={stage:STAGE_KEY[D.meta.stage]||'',date:String(D.meta.published||D.meta.version||'').slice(0,10),sv:'c'};
const STAGE={f:{short:'Final',line:'as Final'},cp:{short:'30-Day Comment Period',line:'for a 30-Day Comment Period'}};
const statusDate=()=>new Date(STATUS.date+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const statusText=()=>STATUS.stage?`Latest version published ${STAGE[STATUS.stage].line} on ${statusDate()}`:`Latest version published on ${statusDate()}`;
const STATS=()=>[[n(T.length),'terms'],[V.fa.length,'focus areas'],[V.tt.length,'term types'],[V.src.length,'sources']];
function paintStats(){
  /* The hero says which version is out; the search section gives the counts (both from the published data). */
  const v=$('aVer'); if(v) v.innerHTML=STATUS.stage?`Latest version published ${STATUS.stage==='f'?'as <b>Final</b>':'for a <b>30-Day Comment Period</b>'} on ${esc(statusDate())}.`:`Latest version published on ${esc(statusDate())}.`;
  const el=$('aStats'); if(el) el.textContent=STATS().map(([x,l])=>`${x} ${l}`).join(' \u00b7 ')+'.';
  const f=$('fStatus'); if(f) f.textContent=statusText();
}
paintStats();
openFromHash();
})();

</script>
